<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR & Verification Link – OPVS | Ontop Pharma Product Verification System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="opvs-layout">
  <div id="opvs-sidebar"></div>
  <div class="opvs-main">
    <div id="opvs-topbar"></div>

    <div class="opvs-content">
      <div class="page-header">
        <div>
          <div class="page-title">QR & Verification Link Generation</div>
          <div class="page-desc">Generate and manage product verification links and QR codes</div>
        </div>
        <a href="batches.html" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Batch List</a>
      </div>

      <!-- Approved Batches without QR (quick select) -->
      <div class="detail-card mb-4" id="batchSelectCard">
        <div class="detail-card-header"><i class="bi bi-box-seam me-2"></i>Select Approved Batch</div>
        <div class="detail-card-body" id="batchSelectBody"></div>
      </div>

      <div id="qrContent">
        <div class="opvs-loading"><span class="spinner-border spinner-border-sm"></span> Loading…</div>
      </div>
    </div>

    <footer class="opvs-footer">
      <span><i class="bi bi-shield-check me-1"></i>Ontop Pharmaceuticals Pvt. Ltd. | OPVS Demo v1.0</span>
      <span>Demo Prototype | Static UI | No Production Database Connected</span>
    </footer>
  </div>
</div>

<!-- Confirm Modal -->
<div class="modal fade" id="confirmModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title" id="confirmModalTitle">Confirm</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body" id="confirmModalBody"></div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" id="confirmModalBtn">Confirm</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/qr.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const user = OPVS_AUTH.requireRole(['Administrator']);
    if (!user) return;
    opvsRenderSidebar('qr-generation.html');
    opvsRenderTopbar('QR & Verification Links', [
      { label: 'Dashboard', href: 'dashboard.html' },
      { label: 'Batch Management', href: 'batches.html' },
      { label: 'QR Generation' }
    ]);

    // Build batch selector
    const approved = OPVS_STATE.batches.filter(b => b.batchStatus === 'Approved');
    const selectBody = document.getElementById('batchSelectBody');
    selectBody.innerHTML = `
      <div class="d-flex gap-2 flex-wrap">
        ${approved.map(b => `
          <button class="btn ${opvsGetParam('id') == b.id ? 'btn-primary' : 'btn-outline-primary'} btn-sm"
                  onclick="selectBatchForQR(${b.id})" id="bsBtn${b.id}">
            <i class="bi bi-box-seam me-1"></i>${b.batchNo}
            ${opvsQrStatusBadge(b.qrStatus)}
          </button>`).join('')}
      </div>
      <small class="text-muted mt-2 d-block">Select a batch to view or generate its verification link and QR code.</small>`;

    qrPageInit();
  });

  function selectBatchForQR(id) {
    const url = new URL(window.location);
    url.searchParams.set('id', id);
    window.history.replaceState({}, '', url);
    // Re-render
    document.getElementById('qrContent').innerHTML = '<div class="opvs-loading"><span class="spinner-border spinner-border-sm"></span> Loading…</div>';
    setTimeout(qrPageInit, 50);
    // Highlight selected
    document.querySelectorAll('[id^=bsBtn]').forEach(b => b.classList.replace('btn-primary', 'btn-outline-primary'));
    const btn = document.getElementById('bsBtn' + id);
    if (btn) btn.classList.replace('btn-outline-primary', 'btn-primary');
  }
</script>
</body>
</html>
